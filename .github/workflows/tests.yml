name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix: the floor with the
      # oldest dependencies it claims, the floor with current ones, and the ceiling.
      # Everything between fails only when a corner does.
      matrix:
        include:
          - { php: '8.3', deps: '--prefer-lowest' }
          - { php: '8.3', deps: '' }
          - { php: '8.5', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including phpstan's own version, which is
      # what the --prefer-lowest corner is for.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          # Both tools are dev dependencies that the --no-dev install below deletes, so
          # they have to come from outside the package. setup-php puts them outside every
          # vendor tree, which for PHPStan is load-bearing rather than merely tidy: run
          # from inside one, it picks up the autoloader sitting beside it and every
          # package THAT tree has installed resolves in the analysed code - so the check
          # passes on exactly the undeclared class it exists to catch.
          tools: phpstan, composer-require-checker

      # One install serves both checks. The dev-free tree is what a consumer actually
      # gets, which is the closure worth analysing; and the checker does not need the dev
      # packages present, because its known-symbol set is built from what "require" NAMES
      # rather than from what is in vendor/. A symbol supplied by a dev dependency is
      # reported with that dependency sitting right there on disk.
      - run: composer install --no-dev --prefer-dist --no-progress

      # The primary check, and the only one that sees two of the three failure modes.
      #
      # A TRANSITIVE dependency - a class reached through something else we declared -
      # survives --no-dev and so is invisible to the analysis below; it breaks for the
      # consumer the day that intermediate package drops it. A missing ext-* is invisible
      # to static analysis entirely, because a function from an absent extension looks
      # exactly like one from core; this reports it and guesses the extension.
      - run: composer-require-checker check composer.json

      # The supplement: it reads the code rather than collecting symbol names, so it says
      # WHERE in src/ an undeclared class is reached and covers functions and constants
      # alongside classes. It cannot see the transitive case at all, so it never replaces
      # the check above.
      #
      # -c is not optional. Without it PHPStan discovers the package's own
      # phpstan.neon.dist, which also analyses tests/ - and PHPUnit is gone now, so the
      # run dies as a configuration error while you are trying to read it as a dependency
      # result.
      - run: >
          phpstan analyse -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
